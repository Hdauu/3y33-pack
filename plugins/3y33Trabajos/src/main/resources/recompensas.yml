# Recompensas del camino de cada trabajo.
# Cada "cada-niveles" niveles aparece un nodo en el camino con 3 opciones: un boost de XP, un boost de plata y XP instantánea, cada una con su rareza sorteada.
# Elegís una (hay que hacer clic dos veces para confirmar) y las otras dos se pierden. El nodo espera hasta que lo elijas, aunque sigas subiendo.
# Los boosts elegidos se guardan en tu perfil y se activan desde el menú de Recompensas. Pueden andar dos a la vez (uno de XP y uno de plata),
# pero dos del mismo tipo no se acumulan. El tiempo cuenta mientras estás conectado con ese trabajo puesto.

# Cada cuántos niveles hay un nodo en el camino.
cada-niveles: 5

# Chance de que una opción de boost salga como MEGA (XP y plata juntos). 0,001 = 0,1%.
probabilidad-mega: 0.001

# peso: chance relativa de cada rareza (la mega no usa peso: sale por la probabilidad de arriba).
# mult: multiplicador del boost (1,25 = +25%). minutos: lo que dura. xp-porcentaje: la XP instantánea da este % de lo que cuesta tu nivel actual.
rarezas:
  comun:
    nombre: Común
    peso: 65
    mult: 1.10
    minutos: 20
    xp-porcentaje: 8
  rara:
    nombre: Rara
    peso: 24
    mult: 1.25
    minutos: 30
    xp-porcentaje: 15
  epica:
    nombre: Épica
    peso: 8
    mult: 1.5
    minutos: 45
    xp-porcentaje: 30
  legendaria:
    nombre: Legendaria
    peso: 2.5
    mult: 2.0
    minutos: 60
    xp-porcentaje: 60
  mega:
    nombre: Mega
    peso: 0
    mult: 2.5
    minutos: 60
    xp-porcentaje: 100

# ---------------------------------------------------------------------------------------------
# HITOS: nodos especiales del camino (tienen que caer en un nivel que sea multiplo de "cada-niveles").
#   rareza: 0 comun, 1 rara, 2 epica, 3 legendaria (escala el dinero y la rareza de los boosts del pack)
#   opciones: lo que podes elegir ("dinero", "pack" de boosts, "chunk" = un chunk gratis)
#   fija: en vez de elegir te dan una sola cosa (mochila4, enc1, enc2, enc3)
# Si borras esta seccion se usan los hitos de fabrica.
# ---------------------------------------------------------------------------------------------
hitos-dinero-por-nivel: 40     # dinero = nivel x esto x (1 + 0,5 x rareza)
hitos-pack-cantidad: 2         # el pack da esta cantidad de boosts de XP y esta de plata

hitos:
  10: {rareza: 0, opciones: [dinero, pack]}
  20: {rareza: 0, opciones: [dinero, pack]}
  30: {rareza: 1, opciones: [dinero, pack]}
  40: {rareza: 1, opciones: [dinero, pack]}
  45: {rareza: 1, opciones: [dinero, pack]}
  50: {rareza: 2, opciones: [dinero, pack, chunk]}
  60: {rareza: 2, opciones: [dinero, pack]}
  65: {rareza: 2, fija: mochila4}
  70: {rareza: 2, opciones: [dinero, pack]}
  75: {rareza: 3, opciones: [dinero, pack]}
  90: {rareza: 3, opciones: [dinero, pack, chunk]}
  100: {rareza: 3, fija: enc1}
  115: {rareza: 3, fija: enc2}
  130: {rareza: 3, fija: enc3}

# Chunks gratis de los trabajos. Mientras "activo" sea false no aparece ninguna opcion de chunk.
# Cada chunk ganado suma un permiso de LuckPerms (3y33.chunk.1, 3y33.chunk.2...) que Lands convierte en un chunk gratis (pack en player-limits.yml).
chunks:
  activo: false
  probabilidad: 0.02        # chance de que UNA de las 3 opciones de un nodo comun sea un chunk
  tope-cuenta: 25           # maximo de chunks gratis ganados por cuenta
  comando: "lp user {jugador} permission set 3y33.chunk.{n} true"
