# Misión global semanal de 3y33Trabajos: se completa ENTREGANDO ítems en el NPC del trabajo.
# Cada ítem vale puntos (los más difíciles de conseguir valen más). Solo cuentan ítems "limpios" (sin nombre ni encantamientos).
# Se recarga con /trabajosadmin recargar.

# Si es true, las misiones (diarias, semanal y global) solo se entregan estando cerca del NPC del trabajo.
solo-en-npc: true
distancia-npc: 8

# Objetivo mínimo de la semana, en puntos (el objetivo de cada semana es el mayor entre este y un % del total de la anterior).
minimo:
  minero: 20000
  lenador: 6000
  granjero: 8000
  cazador: 6000
  pescador: 3000

