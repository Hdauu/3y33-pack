# Misión global de 3y33Trabajos: se completa ENTREGANDO ítems en el NPC del trabajo.
#
# Cada trabajo tiene varios TEMAS. Cuando arranca un ciclo (ver ciclo-dias) se sortea un tema nuevo por trabajo, sin repetir
# los últimos dos. Cada tema es una lista de ítems con sus puntos (lo más difícil de conseguir o de fabricar vale más).
# Solo cuentan ítems "limpios" (sin nombre, encantamientos ni uso). Se recarga con /trabajosadmin recargar.
#
# En las listas se puede escribir:
#   MATERIAL: puntos          un ítem
#   "*_WOOL": 3               comodín: todos los que terminen/empiecen/contengan eso (ej. "*DEEPSLATE*", "*_ORE")
#   "{M}_DOOR": 4             se repite para cada madera (roble, abeto, abedul, jungla, acacia, roble oscuro, manglar, cerezo,
#                             roble pálido, bambú, carmesí y distorsionado); las que no existen se saltean
#   MATERIAL: 0               saca ese ítem (sirve para sacar uno que entró por un comodín)
# Los que vienen después pisan a los de antes.

# Si es true, las misiones (diarias, semanal y global) solo se entregan estando cerca del NPC del trabajo.
solo-en-npc: true
distancia-npc: 8

# Cada cuántos días cambia la misión global (y su tema). Siempre arranca a las 0:00. Con 7 cambia los lunes.
ciclo-dias: 3

# Objetivo mínimo de cada ciclo, en puntos (el objetivo es el mayor entre este y un % del total del ciclo anterior).
minimo:
  minero: 15000
  lenador: 6000
  granjero: 7000
  cazador: 5000
  pescador: 2500

