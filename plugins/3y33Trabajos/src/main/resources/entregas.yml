# Misión global de 3y33Trabajos
#
# Cada ciclo (ver ciclo-dias) cada trabajo sortea UNA misión: entregar una cantidad de UN ítem en el NPC del trabajo.
#  - El ítem sale de los "grupos" de más abajo. Cada ítem tiene un valor de dificultad (los más difíciles de conseguir o
#    de fabricar valen más) que decide la rareza de la misión y cuántos hay que entregar.
#  - Cantidad = esfuerzo del trabajo x factor / valor del ítem ^ exponente (mínimo cantidad-minima). El factor sube solo (hasta
#    3 veces por ciclo) si la misión anterior se completó rápido y baja si casi nadie la hizo, así la dificultad se acomoda al servidor.
#  - Rareza: se sortea con "peso" y le toca un ítem de esa franja: "hasta" es la fracción de los ítems del trabajo (ordenados por valor) que entra en ella. Cada rareza define el fondo de
#    plata (pozo) y el bono (+% de pago y de XP durante bono-horas) que se activa al completarla. El fondo de XP es un % del pozo.
#  - La plata y el XP se reparten entre los colaboradores según el % de ítems que entregó cada uno (hay que haber entregado
#    al menos participacion-minima de lo que pide la misión).
# Solo cuentan ítems "limpios" (sin nombre ni encantamientos). Se recarga con /trabajosadmin recargar.
#
# En los grupos se puede escribir:
#   MATERIAL: valor           un ítem
#   "*_WOOL": 3               comodín: todos los que coincidan (ej. "*DEEPSLATE*", "*_ORE")
#   "{M}_DOOR": 4             se repite para cada madera (roble, abeto, abedul, jungla, acacia, roble oscuro, manglar, cerezo,
#                             roble pálido, bambú, carmesí y distorsionado); las que no existen se saltean
#   MATERIAL: 0               saca ese ítem (sirve para sacar uno que entró por un comodín)
# Los que vienen después pisan a los de antes. Si un ítem está en varios grupos se usa el valor más alto.

# Si es true, las misiones (diarias, semanal y global) solo se entregan estando cerca del NPC del trabajo.
solo-en-npc: true
distancia-npc: 8

# Cada cuántos días cambia la misión global. Siempre arranca a las 0:00. Con 7 cambia los lunes.
ciclo-dias: 3
# Horas que dura el bono después de completarla.
bono-horas: 48
# El fondo de XP es este % del pozo de plata.
xp-ratio: 0.25
# Para cobrar hay que haber entregado al menos este % de lo que pide la misión (1 = 1%).
participacion-minima: 0.01
# Cantidad mínima que puede pedir una misión (para los ítems carísimos, como un bloque de netherite).
cantidad-minima: 3

# Esfuerzo de cada trabajo. Cantidad = esfuerzo x factor / valor^exponente-valor. Con el exponente > 1 los ítems fáciles (valor bajo)
# piden muchísimo más que los difíciles: cobblestone pide decenas de miles y un diamante unos cientos.
# Pensado para que casi todo el servidor colabore (Minero y Cazador son los que más juntan).
esfuerzo:
  minero: 120000
  cazador: 90000
  lenador: 50000
  granjero: 50000
  pescador: 8000

exponente-valor: 1.3
# Tope de cantidad: este número de pilas (los que no se apilan, como botes o picos, usan max-no-apilables).
max-pilas: 1500
max-no-apilables: 150

rarezas:
  comun:
    nombre: Común
    hasta: 0.55
    peso: 55
    pozo: 80000
    bono: 0.20
  rara:
    nombre: Rara
    hasta: 0.83
    peso: 28
    pozo: 120000
    bono: 0.30
  epica:
    nombre: Épica
    hasta: 0.97
    peso: 14
    pozo: 200000
    bono: 0.50
  legendaria:
    nombre: Legendaria
    hasta: 1.0
    peso: 3
    pozo: 350000
    bono: 0.75

