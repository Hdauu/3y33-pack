# Misiones de 3y33Trabajos. Se puede tocar y recargar con /trabajosadmin recargar.
# Todas son de entregar items: el jugador los junta con su trabajo y los entrega desde el menu (item "limpio", sin nombre ni encantamientos).
# La plata de cada mision se multiplica por el multiplicador personal del jugador (nivel + prestigio + racha).

recompensas:
  # Plata base por rareza: comun, rara, epica, legendaria.
  aleatoria: [150, 225, 300, 450]
  elegida: [200, 300, 450, 700]
  # La semanal paga esto por el multiplicador de la rareza (x1, x1,5, x2, x3).
  semanal-base: 1500

# La semanal pide tantas veces la cantidad de una diaria.
semanal-factor: 8

racha:
  por-dia: 0.02
  maximo-dias: 10

# Mision global semanal (reinicia el lunes 0:00): todos los de un trabajo suman al mismo objetivo.
global:
  aporte-minimo: 100          # acciones del trabajo para contar como colaborador
  pago: 600                   # lo que cobra cada colaborador al completarse
  bono: 0.20                  # +20% de pago por acciones y por tiempo a todos los del trabajo
  bono-horas: 48
  porcentaje-anterior: 0.6    # el objetivo de cada semana es el mayor entre el minimo y este % del total de la anterior
  minimo:
    minero: 2000              # menas rotas
    lenador: 6000             # troncos y hongos gigantes
    granjero: 5000            # cultivos y animales
    cazador: 1500             # mobs hostiles
    pescador: 1000            # pescas

# Que se pide, por trabajo y rareza: material: cantidad (de una diaria). La semanal pide semanal-factor veces esa cantidad.
# Se pueden agregar items (que sean del oficio del trabajo); la plata no depende del item sino de la rareza.
