# Hora del dia (0-23, hora de Buenos Aires) en que se renuevan las rarezas de todas las acciones.
reroll-hora: 6

# Horas sin trabajo al abandonar uno (no se puede tomar otro hasta que pasen).
abandonar-horas: 13

# Mundos donde pagan las acciones (picar, matar, pescar, criar). Vale como prefijo: 3y33SMP incluye 3y33SMP_nether y 3y33SMP_the_end. Vacío = todos.
mundos:
  - 3y33SMP

# Iconos y marcos del resource pack en los menus: todos, staff o no. Bedrock siempre ve los items comunes.
iconos-pack: todos

# XP de cada accion = su pago base por este numero (salvo que acciones.yml diga otra cosa).
xp-por-peso: 15

# Pago por tiempo: cada tanto, si hubo al menos una accion que paga, se suma esta plata (por el multiplicador personal).
pago-por-tiempo:
  cada-minutos: 10
  pesos: 15

# El momentum sube con cada accion que paga y baja si te quedas quieto.
momentum:
  maximo: 3.0
  por-accion: 0.02
  quieto-segundos: 10
  baja-por-segundo: 0.01

# Si el jugador no se mueve ni mira durante tanto tiempo, el momentum vuelve a x1 y se corta el pago por tiempo.
afk-segundos: 60

topes:
  mobs-por-hora: 120
  crias-por-hora: 20

# Probabilidad relativa de cada rareza en el sorteo diario.
rarezas:
  pesos:
    COMUN: 55
    RARA: 28
    EPICA: 13
    LEGENDARIA: 4

# Curva de niveles (hasta el 130). El XP total de cada trabajo sale de las horas objetivo para llegar al nivel maximo con un jugador que juega
# horas-por-dia y hace todas las misiones (que suman unos minutos-misiones-por-dia de XP, medidos en "minutos de trabajo"), y del XP por hora de
# cada oficio. Con el exponente, cada nivel cuesta mas que el anterior. xp-por-hora esta ESTIMADO: se corrige con /trabajosadmin balance.
niveles:
  horas-objetivo: 300
  horas-por-dia: 1.5
  minutos-misiones-por-dia: 40
  factor-boosts: 1.05
  exponente: 1.7
  xp-por-hora:
    minero: 4500
    lenador: 15500
    granjero: 25000
    cazador: 13500
    pescador: 4000

# Mochilas: se abren con click derecho teniendolas en la mano. Se abren en paginas de 45 espacios (con flechas abajo si tienen mas de una).
# espacios: total de cada nivel (I, II, III, IV): 4 numeros, multiplos de 45, entre 45 y 360.
# La Mochila I se craftea (8 cueros alrededor de un cofre). Cada nivel se mejora en la mesa de crafteo con la mochila anterior mas los
# materiales de "mejoras" (formato MATERIAL:cantidad, hasta 8 en total). La mochila conserva todo lo que tenia adentro.
# El nivel IV tambien se entrega al reclamar el hito del nivel 65 (la primera vez). Para dar una a mano: /trabajosadmin mochila dar <jugador> <1-4>
mochilas:
  espacios: [45, 90, 135, 180]
  mejoras:
    2: ["LEATHER:4", "IRON_INGOT:4"]
    3: ["DIAMOND:4", "GOLD_INGOT:4"]
    4: ["NETHERITE_INGOT:2", "DIAMOND:3", "ENDER_PEARL:3"]
