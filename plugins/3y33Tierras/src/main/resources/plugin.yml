name: 3y33Tierras
version: 1.12.0
main: ar.com.tresyetres.tierras.Tierras
api-version: '1.21'
author: 3y33 SMP
description: Extras de terrenos para LandClaimPlugin (compra de chunks, mobs, cooldown de teletransportes)
depend: [LandClaimPlugin]
softdepend: [Vault, PlaceholderAPI, QuickShop-Hikari]

commands:
  tierra:
    description: Reclamá y administrá tus terrenos
    usage: /tierra [comprar|info|crear|punto|ir|flags|menu|ayuda]
    permission: tierras.usar
  tierras:
    description: Lista de tus terrenos
    aliases: [terrenos]
    permission: tierras.usar
  hermandad:
    description: Hermandades (grupos con terreno compartido)
    aliases: [hermandades, clan]
    usage: /hermandad [crear|invitar|aceptar|salir|terreno|info|lista|ayuda]
    permission: tierras.usar
  discord:
    description: Link del Discord de 3y33 SMP
  tierrasadmin:
    description: Administración de 3y33Tierras
    permission: tierras.admin

permissions:
  tierras.usar:
    default: true
  tierras.admin:
    default: op
  tierras.bypass.cooldown:
    default: op
