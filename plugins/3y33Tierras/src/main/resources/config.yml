# 3y33Tierras - extras para LandClaimPlugin
prefijo: '&4&l3y33 &8» '

# Compra de chunks extra con /tierra comprar
# Cada jugador arranca con los chunks gratis de LandClaimPlugin (chunkClaimLimit o landclaim.limit.N por rango).
# Precio del próximo chunk = base + incremento * (chunks ya comprados)
compra:
  habilitada: true
  base: 500
  incremento: 250
  maximo-comprados: 200

# Cantidad de terrenos por jugador. Se usa el permiso tierras.terrenos.N más alto que tenga.
terrenos:
  por-defecto: 2

# Teletransporte a los puntos de los terrenos
teletransporte:
  espera-segundos: 3
  cooldown-segundos: 30

# Valores por defecto de los terrenos (true = sucede, false = no sucede). El dueño los cambia en /tierra flags
flags-por-defecto:
  monstruos: true
  phantoms: true
  animales: true
  fuego: false
  liquidos: false
  cultivos: false
  hojas: true

# Títulos al entrar y salir de un terreno (si el dueño configura títulos propios en Ajustes, se usan esos)
titulos:
  habilitados: true
  # aviso al salir de un terreno
  mostrar-salida: false
  # en milisegundos (1000 = 1 segundo)
  aparecer-ms: 400
  duracion-ms: 3500
  desaparecer-ms: 900

# Stickers exclusivos: nombre -> rango mínimo (permiso tierras.stickers.<rango>). Los que no están acá son para todos.
stickers-por-rango:
  fuego: sheriff
  rayo: sheriff
  calavera: sheriff
  diamante: supreme
  gema: supreme
  escudo: supreme
  corona: global
  trofeo: global

# Link que muestra /discord
discord: 'https://ds.3y33.com.ar'
