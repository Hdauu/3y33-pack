name: 3y33Tiendas
version: 1.3.1
main: ar.com.tresyetres.tiendas.TiendasPlugin
api-version: '1.21'
author: 3y33 SMP
description: Reglas de tiendas (QuickShop) para terrenos de Lands y holograma propio por tienda (item + texto, movibles)
