# 3y33Shops - tiendas de cofre atadas a Lands
maximo-tiendas-por-tierra: 30
precio-maximo: 1000000
cantidad-maxima-personalizada: 2304
# segundos entre clics en la ventana (evita spam de clics)
pausa-clics-ms: 150

holograma:
  separacion-tienda: 0.06
  altura-texto: 0.25
  separacion-lineas: 0.26
  escala-item: 0.6
  # El texto (nombre, precios, mensaje) solo se ve en la tienda que estas apuntando, a esta distancia como maximo. El item flota siempre desde rango-aparicion.
  rango-texto: 6.0
  # Que tan cerca de la mira tiene que estar el cofre (o el item) para contar como "mirandola", en bloques; mirada-margen agranda eso al dejar de mirar (evita parpadeos).
  mirada-radio: 0.8
  mirada-radio-doble: 1.3
  mirada-margen: 1.4
  rango-aparicion: 14.0
  rango-desaparicion: 24.0
  vaiven: 0.12

buscar-espera-segundos: 10

mostrar:
  radio: 40.0
  segundos: 20

buscar-costo: 0

integridad:
  revisar-cada-segundos: 120

# Banner/fondo de la ventana TIENDA (necesita el resource pack): staff = solo staff (para probar), todos, no
ventana-banner: staff
