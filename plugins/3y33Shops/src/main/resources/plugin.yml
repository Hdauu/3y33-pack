name: 3y33Shops
version: 2.8.0
main: ar.com.tresyetres.shops.ShopsPlugin
api-version: '1.21'
author: 3y33 SMP
description: Tiendas de 3y33 SMP (motor propio, atadas a Lands)
depend: [Vault, Lands]
softdepend: [floodgate]
commands:
  tienda:
    description: Tiendas de cofre
    usage: /tienda [crear|eliminar|buscar|mostrar|punto]
    aliases: [tiendas]
  tiendaadmin:
    description: Herramientas de staff para las tiendas
    usage: /tiendaadmin [lista|info|borrar|recargar]
