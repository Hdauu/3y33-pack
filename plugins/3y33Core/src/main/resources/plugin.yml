name: 3y33Core
version: 1.3.2
main: ar.com.tresyetres.core.Core
api-version: '1.21'
softdepend: [AuthMe, floodgate, FancyDialogs, FancyHolograms, FancyNpcs]
author: 3y33 SMP
description: Reglas, anuncios, reportes y comandos de 3y33 SMP

commands:
  reglas:
    description: Reglas del servidor
    aliases: [rules, normas]
  report:
    description: Reportá a un jugador
    aliases: [reportar, reporte]
  rtp:
    description: Viajá a un lugar al azar del mundo
    aliases: [wild, explorar]
  editor:
    description: Editor de hologramas y NPCs con botones
    permission: tresyetres.staff
    aliases: [editar, mover]
  reportes:
    description: Ver los últimos reportes
    permission: tresyetres.staff
  3y33core:
    description: Administración de 3y33Core
    permission: tresyetres.admin

permissions:
  tresyetres.staff:
    default: op
  tresyetres.admin:
    default: op
