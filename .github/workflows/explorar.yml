name: Explorar API Fancy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Firmas completas
        run: |
          mkdir j && cd j
          curl -sSL -o fh.jar "https://cdn.modrinth.com/data/5QNgOj66/versions/dBBdi95S/FancyHolograms-2.12.0.jar"
          curl -sSL -o fn.jar "https://cdn.modrinth.com/data/EeyAn23L/versions/Xvcnsc7e/FancyNpcs-2.12.1%2B379.jar"
          exec > ../api-fancy.txt 2>&1
          for c in de.oliver.fancyholograms.api.FancyHologramsPlugin de.oliver.fancyholograms.api.HologramManager de.oliver.fancyholograms.api.HologramStorage de.oliver.fancyholograms.api.hologram.Hologram; do echo "##### $c"; javap -public -cp fh.jar $c; done
          for c in de.oliver.fancynpcs.api.NpcManager de.oliver.fancynpcs.api.Npc; do echo "##### $c"; javap -public -cp fn.jar $c; done
          unzip -l fh.jar | grep -i "plugin.yml\|paper-plugin" 
      - name: Guardar el resultado en el repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add api-fancy.txt
          git commit -m "api-fancy: resultado" || true
          git pull --rebase -q || true
          git push
