name: Compilar 3y33Core

on:
  push:
    paths:
      - 'plugins/3y33Core/src/**'
      - 'plugins/3y33Core/pom.xml'
      - '.github/workflows/tierras.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Bajar la API de Fancy (jars exactos que usa el server)
        working-directory: plugins/3y33Core
        run: |
          mkdir -p libs
          curl -sSfL -o libs/FancyHolograms.jar "https://cdn.modrinth.com/data/5QNgOj66/versions/dBBdi95S/FancyHolograms-2.12.0.jar"
          curl -sSfL -o libs/FancyNpcs.jar "https://cdn.modrinth.com/data/EeyAn23L/versions/Xvcnsc7e/FancyNpcs-2.12.1%2B379.jar"
      - name: Compilar
        working-directory: plugins/3y33Core
        run: mvn -B -q package 2>&1 | tee ../../build-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Guardar el error de compilacion
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f build-log.txt
          git commit -m "build-log: error de compilacion" || true
          git pull --rebase -q || true
          git push || true
      - name: Guardar el jar en el repo
        run: |
          cp plugins/3y33Core/target/3y33Core-*.jar plugins/3y33Core/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add plugins/3y33Core/*.jar
          git commit -m "3y33Core: jar compilado" || echo "sin cambios"
          git push
