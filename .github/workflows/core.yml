name: Compilar 3y33Core

on:
  push:
    paths:
      - 'plugins/3y33Core/src/**'
      - 'plugins/3y33Core/pom.xml'
      - '.github/workflows/tierras.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar
        working-directory: plugins/3y33Core
        run: mvn -B -q package
      - name: Guardar el jar en el repo
        run: |
          cp plugins/3y33Core/target/3y33Core-*.jar plugins/3y33Core/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add plugins/3y33Core/*.jar
          git commit -m "3y33Core: jar compilado" || echo "sin cambios"
          git push
