name: Inspeccion LandClaim
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Bajar y listar
        run: |
          mkdir -p /tmp/x && cd /tmp/x
          curl -sSfL -o lc.jar "https://api.modrinth.com/maven/maven/modrinth/landclaimplugin/3.4.0/landclaimplugin-3.4.0.jar"
          unzip -qo lc.jar
          : > /tmp/out.txt
          for c in org.ayosynk.landClaimPlugin.models.ClaimProfile org.ayosynk.landClaimPlugin.models.ChunkPosition $(find org/ayosynk/landClaimPlugin -name '*.class' | sed 's#/#.#g;s#\.class$##' | grep -v "\.lib\." | grep -iE "command" | grep -v '\$' | head -25); do javap -p -cp . "$c" >> /tmp/out.txt 2>&1; done
          cp /tmp/out.txt $GITHUB_WORKSPACE/api-landclaim4.txt
      - name: Guardar
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f api-landclaim4.txt; git commit -m "api-landclaim: inspeccion" || true; git pull --rebase -q || true; git push
